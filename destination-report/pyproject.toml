[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "household-report"
version = "0.1.0"
description = "Local household DNS destination reporting with explicitly triggered, budget-limited classification"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "mcp>=1.8,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "lefthook>=1.7,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/household_report"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns line wrapping; E501 would fight it on long string literals.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["household_report"]

[tool.ruff.format]
quote-style = "double"
