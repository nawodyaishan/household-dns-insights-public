# Not applied until user-run root protection and its verification pass.
# Keep loopback test access; expose no wildcard, public or IPv6 bindings.
services:
  pihole:
    ports: !override
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"
      - "127.0.0.1:8443:443/tcp"
      - "10.10.10.20:53:53/udp"
      - "10.10.10.20:53:53/tcp"
      - "10.10.10.20:8443:443/tcp"
